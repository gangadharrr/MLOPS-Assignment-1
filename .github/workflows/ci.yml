name: MLOps CI
on: [push, pull_request]
jobs:
  lint-test-train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Lint
        run: flake8 src app tests
      - name: Train (uses committed data/heart.csv)
        run: python src/train.py --data data/heart.csv --out models
      - name: Unit tests (model exists, so predict tests cannot be skipped)
        run: pytest -v
      - name: Build serving image
        run: docker build -t heart-api:ci .
      - name: Container smoke test
        run: |
          docker run -d --name heart-ci -p 8000:8000 heart-api:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8000/ready && break || sleep 2; done
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" -d @sample_request.json
          docker logs heart-ci
      - name: Upload model and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-and-metrics
          path: models/
